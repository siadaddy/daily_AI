name: 📰 AI 파이프라인 (수집 + 생성)

on:
  schedule:
    # 매일 21:00 UTC = 익일 06:00 KST
    - cron: '0 21 * * *'
  workflow_dispatch: # 수동 트리거

jobs:
  collect:
    name: 🔍 뉴스 수집
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: 의존성 설치
        run: pip install -r pipeline/requirements.txt

      - name: 뉴스 수집 실행
        run: python pipeline/collect.py

      - name: output 디렉터리 artifact 업로드
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-output
          path: pipeline/output/
          retention-days: 1

      - name: 실패 시 ntfy 알림
        if: failure()
        run: |
          curl -s -X POST https://ntfy.sh/ \
            -H "Content-Type: application/json" \
            -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"❌ AI 파이프라인 실패\",\"message\":\"collect 단계 실패. GitHub Actions 로그 확인 필요.\",\"priority\":4,\"tags\":[\"warning\"]}"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

  generate:
    name: 🤖 콘텐츠 생성
    runs-on: ubuntu-latest
    needs: collect
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: 의존성 설치
        run: pip install -r pipeline/requirements.txt

      - name: collect artifact 다운로드
        uses: actions/download-artifact@v7
        with:
          name: pipeline-output
          path: pipeline/output/

      - name: 콘텐츠 생성 실행
        run: python pipeline/main.py

      - name: 실패 시 ntfy 알림
        if: failure()
        run: |
          curl -s -X POST https://ntfy.sh/ \
            -H "Content-Type: application/json" \
            -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"❌ AI 파이프라인 실패\",\"message\":\"generate 단계 실패. GitHub Actions 로그 확인 필요.\",\"priority\":4,\"tags\":[\"warning\"]}"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

  capture:
    name: 📸 사이트 화면 캡처
    runs-on: ubuntu-latest
    needs: generate
    env:
      SITE_URL: https://siadaddy-ai.vercel.app
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 설정
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # 앱 의존성은 필요 없다 — 배포된 사이트를 바깥에서 찍을 뿐이다
      - name: Playwright 설치
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      # 생성 직후에는 아직 그날 지면이 안 보인다.
      # 페이지 캐시(revalidate 300s)와 배포 반영을 기다린다.
      - name: 그날 지면이 뜰 때까지 대기
        run: |
          DATE=$(TZ=Asia/Seoul date +%F)
          echo "대상: $SITE_URL/news/$DATE"
          for i in $(seq 1 30); do
            if curl -sf "$SITE_URL/news/$DATE" | grep -q 'data-capture="card-01"'; then
              echo "지면 확인됨 (${i}회차)"; exit 0
            fi
            echo "  대기 중… ${i}/30"; sleep 20
          done
          echo "10분 안에 지면이 뜨지 않았다"; exit 1

      - name: 캡처 + 업로드
        run: node scripts/capture-site.mjs

      - name: 실패 시 ntfy 알림
        if: failure()
        run: |
          curl -s -X POST https://ntfy.sh/ \
            -H "Content-Type: application/json" \
            -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"❌ 사이트 캡처 실패\",\"message\":\"capture 단계 실패. 블로그용 화면 이미지가 갱신되지 않았다.\",\"priority\":3,\"tags\":[\"camera\"]}"
