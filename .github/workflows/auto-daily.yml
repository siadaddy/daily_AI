name: 🚗 자동차 인사이트 (수집 + 분석)

# 기존 pipeline-daily.yml(AI 뉴스)과 완전히 독립이다 — 한쪽이 실패해도 다른 쪽은 돈다.
# 하루 2회: 05:30 KST(아침 브리핑 전) / 17:30 KST(오후 속보 보강).
# 같은 기사는 link unique 로 걸러지므로 여러 번 돌아도 중복 저장·중복 알림이 없다.
on:
  schedule:
    - cron: '30 20 * * *' # 05:30 KST
    - cron: '30 8 * * *' # 17:30 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DB 저장·알림 없이 결과만 확인 (true/false)'
        required: false
        default: 'false'

concurrency:
  group: auto-insight
  cancel-in-progress: false

jobs:
  auto-insight:
    name: 🔍 수집 → 🤖 분석 → 💾 저장
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: 의존성 설치
        run: pip install -r pipeline/requirements.txt

      # 규칙(브랜드·속보·필터)이 깨진 채로 알림이 나가는 것을 막는 문지기
      - name: 규칙 단위 테스트
        run: python -m unittest discover -s pipeline/tests -v

      - name: 수집
        run: python pipeline/auto_collect.py

      - name: 분석·저장
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python pipeline/auto_analyze.py --dry-run
          else
            python pipeline/auto_analyze.py
          fi

      - name: 실패 시 ntfy 알림
        if: failure()
        run: |
          curl -s -X POST https://ntfy.sh/ \
            -H "Content-Type: application/json" \
            -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"❌ 자동차 인사이트 실패\",\"message\":\"auto-daily 실패. GitHub Actions 로그 확인 필요.\",\"priority\":4,\"tags\":[\"warning\"]}"
